# The source of the macOS app's Xcode project; generate it with `xcodegen generate` (ADR 0011).
name: Outloud
options:
  bundleIdPrefix: io.github.maxnowack
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
packages:
  OutloudKit:
    path: ../../OutloudKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Outloud:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: OutloudKit
        product: OutloudKit
      - package: OutloudKit
        product: OutloudUI
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Outloud
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Outloud records your voice while you hold the shortcut, to turn it into text on this Mac.
    entitlements:
      path: Generated/Outloud.entitlements
      properties:
        # The hardened runtime blocks the microphone without it (ADR 0009: no sandbox).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maxnowack.outloud
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
