# The source of the iOS app's Xcode project; generate it with `xcodegen generate` (ADR 0011).
name: Outloud
options:
  bundleIdPrefix: io.github.maxnowack
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
packages:
  OutloudKit:
    path: ../../OutloudKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Outloud:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # The app icon, one Icon Composer document for both apps (docs/DESIGN.md §"App icon").
      - path: ../shared/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: OutloudKit
        product: OutloudKit
      - package: OutloudKit
        product: OutloudUI
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Outloud
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Outloud records your voice while you dictate, to turn it into text on this iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maxnowack.outloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
