# The source of the iOS app's Xcode project; generate it with `xcodegen generate` (ADR 0011).
name: Outloud
options:
  bundleIdPrefix: dev.nowack
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
packages:
  OutloudKit:
    path: ../../OutloudKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Outloud:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Resources
      # The app icon, one Icon Composer document for both apps (docs/DESIGN.md §"App icon").
      - path: ../shared/AppIcon.icon
        buildPhase: resources
    dependencies:
      - target: OutloudWidgets
        embed: true
      - package: OutloudKit
        product: OutloudKit
      - package: OutloudKit
        product: OutloudUI
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Outloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Outloud records your voice while you dictate, to turn it into text on this iPhone.
        # A dictation from another app records in the background with a Live Activity (ADR 0022).
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        # Outloud only uses HTTPS, which is exempt; no export question on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nowack.outloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 95ZC649QPM
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # The control for the Action Button, the Control Center and the Lock Screen (ADR 0017).
  OutloudWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Outloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nowack.outloud.widgets
        DEVELOPMENT_TEAM: 95ZC649QPM
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
